name: pulumi-events-delivery
description: Pulumi Delivery pipeline (verify, then update the pulumi-events-infra stack) running in Pulumi Cloud
runtime:
  name: python
  options:
    toolchain: uv
config:
  targetProject:
    type: string
    default: pulumi-events-infra
  targetStack:
    type: string
    default: dev
  githubRepository:
    type: string
    default: pulumi/pulumi-events
    description: owner/name of the GitHub repo (Pulumi GitHub integration must have access)
  branch:
    type: string
    default: main
  infraDir:
    type: string
    default: deploy
    description: Directory containing the target Pulumi program
