[project]
name = "pulumi-events"
version = "0.1.0"
description = "MCP server for managing events on Meetup.com and Luma via AI assistants"
readme = "README.md"
authors = [{ name = "Engin Diri", email = "engin.diri@ediri.de" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.6,<5",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "tzdata>=2025.2",
]

[project.scripts]
pulumi-events = "pulumi_events.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulumi_events"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # conflicts with D211 (no blank line before class docstring)
    "D213",    # conflicts with D212 (summary on first line)
    "COM812",  # conflicts with the ruff formatter
    "CPY001",  # copyright headers are not used in this project
    "B008",    # Depends() in defaults is the standard FastMCP pattern
    "ANN401",  # Any is unavoidable for **kwargs in protocol / provider APIs
    "S603",    # subprocess calls are needed for the Pulumi ESC CLI
    "S607",    # partial executable path ("pulumi" CLI)
    "TRY003",  # project exceptions (ProviderError/ToolError) are built from contextual messages
]

[tool.ruff.lint.isort]
known-first-party = ["pulumi_events"]

[tool.ruff.lint.flake8-type-checking]
# FastMCP resolves tool/resource annotations at runtime, so they must stay real imports.
runtime-evaluated-decorators = [
    "pulumi_events.server.mcp.tool",
    "pulumi_events.server.mcp.resource",
]

[tool.ruff.lint.per-file-ignores]
"src/pulumi_events/tools/*" = [
    "D417",    # docstrings are LLM-visible tool descriptions; injected deps (ctx, provider) are not tool args
    "PLR0913", # tool signatures are the public MCP API and must not change
    "PLR0917", # tool signatures are the public MCP API and must not change
    "FBT001",  # MCP clients always pass tool arguments by name, never positionally
    "FBT002",  # MCP clients always pass tool arguments by name, never positionally
]
"tests/*" = [
    "S101",    # use of assert is expected in pytest
    "ANN201",  # public test functions don't need return annotations
    "INP001",  # tests/ is a rootdir-imported pytest directory, not a package
    "D101",    # test classes are self-describing groupings
    "D102",    # test methods are self-describing by name
    "D103",    # test functions are self-describing by name
    "D107",    # test helper __init__ needs no docstring
    "PLR2004", # magic values are normal in test assertions
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
